name: Ma'lumotni yangilash

# Saytdagi "Ma'lumotni yangilash" tugmasi shu sahifani ochadi (Run workflow).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Faqat shu banklar (vergul bilan, masalan: hamkorbank,nbu). Bo'sh — hammasi"
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * 1"   # har dushanba, 08:17 Toshkent vaqti

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # keyinroq main ni pull qilish uchun to'liq tarix

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: O'rnatish
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Bank saytlarini o'qish (skraper)
        env:
          ONLY: ${{ inputs.only }}
        run: |
          ARGS=(--out output/run --max-pages 25 --concurrency 6 --timeout 45)
          if [ -n "$ONLY" ]; then
            [[ "$ONLY" =~ ^[a-z0-9_,]+$ ]] || { echo "Noto'g'ri bank ro'yxati: $ONLY"; exit 1; }
            ARGS+=(--only "$ONLY")
          fi
          python scrape.py "${ARGS[@]}"

      - name: Eng so'nggi kodni olish
        # Skraper ishlayotganda main o'zgargan bo'lishi mumkin: sayt eng yangi shablon bilan yasalsin va push rad etilmasin
        run: git pull --ff-only origin main

      - name: Saytni qayta yasash
        run: |
          python research/live.py output/run/all.json
          python research/build.py

      - name: Natijani saqlash
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/live docs site
          if git diff --cached --quiet; then
            echo "O'zgarish yo'q"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Ma'lumot avtomatik yangilandi ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Saytni qayta joylash
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build so'rovi bajarilmadi — push'dan keyin o'zi yangilanadi"

      - name: Skraper natijasini yuklab olish uchun saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output
          path: output/run
          if-no-files-found: ignore
