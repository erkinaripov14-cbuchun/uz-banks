name: O'zbekistondan yangilash

# Chet eldan ochilmaydigan bank saytlari (Asakabank, Anorbank, Smartbank) O'zbekistondagi kompyuter yoki serverda o'qiladi.
# U yerda GitHub self-hosted runner ("uz" belgisi bilan, Windows yoki Linux) o'rnatilgan bo'lishi kerak — README dagi yo'riqnoma.
# Asosiy yangilash tugagach o'zi boshlanadi. Kompyuter o'chiq bo'lsa, navbatda kutib turadi va asosiy yangilashga xalaqit bermaydi.
on:
  workflow_run:
    workflows: ["Ma'lumotni yangilash"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-uz
  cancel-in-progress: true

jobs:
  uz:
    runs-on: [self-hosted, uz]
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    # Har bir qadam bitta "python ..." buyrug'i — Windows (PowerShell) va Linux (bash) da bir xil ishlaydi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: O'rnatish
        run: python uz_yangilash.py --setup

      - name: Bank saytlarini o'qish va saytni yangilash
        run: python uz_yangilash.py

      - name: Saytni qayta joylash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python uz_yangilash.py --pages-build
