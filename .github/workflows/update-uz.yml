name: O'zbekistondan yangilash

# Chet eldan ochilmaydigan bank saytlari (Asakabank, Anorbank, Smartbank) O'zbekistondagi kompyuterda o'qiladi.
# Kompyuterda GitHub self-hosted runner ("uz" belgisi bilan) o'rnatilgan bo'lishi kerak — README dagi yo'riqnoma.
# Asosiy yangilash tugagach o'zi boshlanadi. Kompyuter o'chiq bo'lsa, navbatda kutib turadi va asosiy yangilashga xalaqit bermaydi.
on:
  workflow_run:
    workflows: ["Ma'lumotni yangilash"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-uz
  cancel-in-progress: true

jobs:
  uz:
    runs-on: [self-hosted, windows, uz]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: O'rnatish
        run: python -m pip install -r requirements.txt

      - name: Brauzer
        run: python -m playwright install chromium

      - name: Bank saytlarini o'qish va saytni yangilash
        run: python uz_yangilash.py

      - name: Saytni qayta joylash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/pages/builds" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
